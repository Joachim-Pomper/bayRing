# Example nested-sampler run for FakeNR catalog with two Kerr modes: Fundamental QNM + Primary redshift mode.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_FakeNR_Kerr_220_rs_minimization.ini
#
# The filename uses British spelling, but the accepted bayRing method value is
# `Minimization`.

[I/O]

outdir=FakeNR_Kerr_220_rs_minimization
screen-output = 1

[NR-data]

error   = constant-0.005
catalog = FakeNR
dir     = fakeNR/Kerr_2220_rs/
ID      = Kerr_2220_rs2220

[Injection-data]


[Model]

template = Kerr
QNM-modes = 220
Kerr-redshift-modes = 220

[Inference]

method = Minimization

# These are the same time-domain settings used by the quick nested-sampler
# example, so the minimisation result can be compared directly against it.
t-start    = 0.0
t-end      = 80.0
min-method = trf

# Number of random starting points. The first seed is the prior midpoint and
# the rest are drawn uniformly inside the configured prior bounds using `seed`.
n-random-seeds = 64
seed           = 1234

# Maximum scipy function evaluations for each starting point.
min-iter-max = 1000

[Priors]
