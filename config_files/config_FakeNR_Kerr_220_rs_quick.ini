# Example nested-sampler run for FakeNR catalog with two Kerr modes: Fundamental QNM + Primary redshift mode.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_FakeNR_Kerr_220_rs_quick.ini
#

[I/O]

outdir=FakeNR_Kerr_220_rs_quick
screen-output = 1

[NR-data]

error   = constant-0.005
catalog = FakeNR
dir     = fakeNR/Kerr_2220_rs/
ID      = Kerr_2220_rs2220

[Injection-data]


[Model]

template = Kerr
QNM-modes = 220
Kerr-redshift-modes = 220

[Inference]

nlive   = 64
maxmcmc = 64
t-start = 0.0
t-end   = 80.0

[Priors]
