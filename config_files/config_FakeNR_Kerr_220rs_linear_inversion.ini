# Example nested-sampler run for FakeNR catalog with two Kerr modes: Fundamental QNM + Primary redshift mode.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_FakeNR_Kerr_220rs_linear_inversion.ini
#

[I/O]

outdir=FakeNR_Kerr_220rs_linear_inversion
screen-output = 1

[NR-data]

error   = constant-0.005
catalog = FakeNR
dir     = fakeNR/Kerr_up_to_4th_overtone_rs/
ID      = Kerr_10_modes_220rs

[Injection-data]

[Model]

template = Kerr
QNM-modes = 220,2-20,221,2-21,222,2-22,223,2-23,224,2-24
Kerr-redshift-modes = 220

[Inference]

method = Linear-inversion

t-start = 0.0
t-end   = 80.0

# Absolute floor applied to Fisher-matrix eigenvalues before inversion.
linear-inversion-eigenvalue-tol = 1e-10


[Priors]
