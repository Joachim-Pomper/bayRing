# Example linear-inversion with the FakeNR catalog
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_FakeNR_Kerr_linear_inversion.ini
#
# Linear inversion directly solves the free complex Kerr amplitudes. Any
# non-linear parameters must be fixed in [Priors] or inferred with Minimization.

[I/O]

outdir        = FakeNR_Kerr_linear_inversion
screen-output = 1

[NR-data]

error = constant-0.0001
catalog = FakeNR
dir     = fakeNR/Kerr_up_to_5th_overtone
ID      = Kerr_10_modes

[Injection-data]

[Model]

template  = Kerr
QNM-modes = 220,2-20,221,2-21,222,2-22,223,2-23,224,2-24

[Inference]

method = Linear-inversion

t-start = 0.0
t-end   = 80.0

# Absolute floor applied to Fisher-matrix eigenvalues before inversion.
linear-inversion-eigenvalue-tol = 1e-10

[Priors]
