# Example nested-sampler run for FakeNR catalog with two Kerr modes.
#
# Run from the repository root with:
#
#   bayRing --config-file config_files/config_FakeNR_Kerr_220_221_quick.ini
#

[I/O]

outdir=FakeNR_Kerr_221_quick
screen-output = 1

[NR-data]

error   = constant-0.005
catalog = FakeNR
dir     = fakeNR/Kerr_2220_2221/
ID      = Kerr_220_221

[Injection-data]


[Model]

template = Kerr
QNM-modes = 220,221

[Inference]

nlive   = 64
maxmcmc = 32
t-start = 0.0
t-end   = 80.0

[Priors]
